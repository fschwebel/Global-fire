<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Fire</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>"
    />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <div id="yearbox">
          <div id="year"></div>
          <div id="tempnote">
            <span id="tempavg"></span>
            <span id="tempmax"></span>
          </div>
        </div>
        <div id="stats">
          <span id="hectares">0 ha burnt</span>
          <span id="animals" hidden></span>
          <span id="houses" hidden></span>
          <span id="ffs" hidden></span>
          <span id="civs" hidden></span>
        </div>
        <div id="weather">
          <span id="windarrow">➤</span>
          <span id="windspeed"></span>
          <span id="dryness"></span>
        </div>
      </div>
      <div id="main">
        <div id="sidebar">
          <div id="palette">
            <button id="tool-engine" type="button" class="tool active" title="Dispatch engine — click the map, the nearest engine responds">🚒</button>
            <button id="tool-evac" type="button" class="tool locked" title="">📢</button>
            <button id="tool-bomber" type="button" class="tool locked" title="">🛩</button>
            <button id="tool-tower" type="button" class="tool locked" title="">🗼<span id="tower-count" class="badge" hidden></span></button>
            <button id="tool-crew" type="button" class="tool locked" title="">⛏</button>
          </div>
          <div id="engines"></div>
        </div>
        <div id="mapwrap">
          <canvas id="map"></canvas>
          <div id="alerts"></div>
        </div>
      </div>
      <div id="bottombar">
        <div id="selection"></div>
        <div id="timectl">
          <button id="btn-pause" type="button">⏸</button>
          <button id="btn-play" type="button" class="active">▶</button>
          <div id="seasonbar"><div id="seasonfill"></div></div>
        </div>
      </div>
      <div id="version"></div>
      <div id="briefing" hidden>
        <h2 id="b-year"></h2>
        <p id="b-growth" hidden>
          The department has widened your sector — more forest, more people, yours to protect.
        </p>
        <p id="b-unlock" hidden></p>
        <p id="b-fact"></p>
        <button id="btn-begin" type="button">Begin season</button>
      </div>
      <div id="debrief" hidden>
        <h2 id="d-title">Season over — the rains arrive</h2>
        <div id="report"></div>
        <p id="d-campaign"></p>
        <button id="btn-restart" type="button">Continue</button>
      </div>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
